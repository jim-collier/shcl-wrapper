## The pipeline's own Python. Tabs to indent, like the rest of the house style,
## and a wider line since the fuzz tables read better unwrapped.
line-length = 120
target-version = "py311"

[format]
indent-style = "tab"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

## W191 bans tabs, which the formatter is set to write. SIM108 wants a long
## if/else as a one-line ternary, which reads worse.
ignore = ["W191", "E101", "SIM108"]
