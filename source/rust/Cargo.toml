[package]
name = "shclw"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "A small, stable wrapper over several shcl versions"
publish = false

[features]
default = []
shcl1 = ["dep:shcl1"]
shcl2 = ["dep:shcl2"]
# 3.0 checks a 2.x file against 2.0 before it upgrades it.
shcl3 = ["dep:shcl3", "shcl2"]

[dependencies]
shcl1 = { package = "shcl", version = "=1.2.0", optional = true, default-features = false }
shcl2 = { package = "shcl", version = "=2.0.0", optional = true, default-features = false }
shcl3 = { package = "shcl", git = "https://github.com/yottacore/shcl", rev = "ea0998fa41f7797e537741aea6cdf43a5f401eb0", optional = true, default-features = false }

[[bin]]
name = "shclw-drive"
required-features = ["shcl1", "shcl2", "shcl3"]

[[test]]
name = "cases"
required-features = ["shcl1", "shcl2", "shcl3"]

[[test]]
name = "api"
required-features = ["shcl1", "shcl2", "shcl3"]
